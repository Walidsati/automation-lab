name: Daily Sales Report

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python week2/run_report.py

      - name: Show generated log
        if: always()
        run: cat week2/data/run_report.log || echo "no log found"

      - name: Commit generated files back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week2/data/run_report.log
          git add week2/data/sales_report.pdf
          git add week2/data/sales_report_xw.xlsx
          git add week2/data/sales_by_region.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily report [skip ci]"
            git push
          fi
