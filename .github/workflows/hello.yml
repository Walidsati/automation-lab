name: Hello from the cloud

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show secret is available
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "Secret is EMPTY"
            exit 1
          else
            echo "Secret is available (length: ${#DEMO_SECRET})"
          fi

      - name: Run hello_time
        run: python3 week1/hello_time.py

      - name: Show log file
        if: always()
        run: cat week1/hello_time.log || echo "no log file was created"
