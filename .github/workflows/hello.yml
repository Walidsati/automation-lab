name: Hello from the cloud

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hello_time
        run: python3 week1/hello_time.py

      - name: Show log file
        if: always()
        run: cat week1/hello_time_cloud.log || echo "no cloud log yet"

      - name: Commit updated log back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week1/hello_time_cloud.log
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update hello_time_cloud.log [skip ci]"
            git push
          fi
