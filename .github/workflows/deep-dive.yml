name: Deep dive

on:
  workflow_dispatch:

# Prevent multiple simultaneous runs
concurrency:
  group: deep-dive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1 — Test the same script on multiple OS/Python combos
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python }}

      - name: Show Python version
        run: python --version

      - name: Run pipeline
        run: python week2/monthly_summary.py

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.os }}-py${{ matrix.python }}
          path: week2/data/monthly_by_region.csv

  # Job 2 — Runs only after all matrix jobs finish
  summary:
    name: collect artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what we got
        run: |
          echo "=== Artifact tree ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Sample content ==="
          head -5 artifacts/summary-ubuntu-latest-py3.12/monthly_by_region.csv
